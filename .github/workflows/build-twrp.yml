name: Build TWRP Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y universe multiverse restricted
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3

      - name: Initialize TWRP minimal manifest
        run: |
          mkdir twrp
          cd twrp
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > repo
          chmod a+x repo
          python3 ./repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-9.0 --depth=1
          git clone https://github.com/Cosmic802/android_device_samsung_on7nlteskt.git device/samsung/on7nlteskt

      - name: Build recovery image
        run: |
          cd twrp
          source build/envsetup.sh
          lunch omni_on7nlteskt-eng
          make -j$(nproc --all) recoveryimage

      - name: Upload recovery.img artifact
        uses: actions/upload-artifact@v4
        with:
          name: twrp-on7nlteskt
          path: twrp/out/target/product/on7nlteskt/recovery.img
